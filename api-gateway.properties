server.port=8080

resilience4j.circuitbreaker.instances.identity-service.slidingWindowsSize=10
resilience4j.circuitbreaker.instances.identity-service.failureRateThreshold=50
resilience4j.circuitbreaker.instances.identity-service.waitDurationInOpenState=10000
resilience4j.circuitbreaker.instances.identity-service.permittedNumberOfCallsInHalfOpenState=3


spring.cloud.gateway.routes[0].id=identity-public
spring.cloud.gateway.routes[0].uri=lb://identity-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/v1/public/**

spring.cloud.gateway.routes[1].id=identity-secured
spring.cloud.gateway.routes[1].uri=lb://identity-service
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/v1/auth/**

spring.cloud.gateway.routes[1].filters[0]=AuthenticationFilter

spring.cloud.gateway.routes[1].filters[1].name=CircuitBreaker
spring.cloud.gateway.routes[1].filters[1].args.name=identity-service
spring.cloud.gateway.routes[1].filters[1].args.fallbackUri=forward:/fallback/identity

